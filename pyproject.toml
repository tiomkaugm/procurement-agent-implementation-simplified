[project]
name = "rapat-pengadaan"
version = "0.1.0"
description = "Sistem multi-agen berbasis aturan: rapat koordinasi pengadaan (Kelompok 2, Agen Cerdas Enterprise)"
requires-python = ">=3.14"
dependencies = [
    "pyyaml",
    "matplotlib",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
